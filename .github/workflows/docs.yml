name: Build documentation and deploy to GitHub Pages

# The docs site (pmndrs/docs, the MDX in docs/) with the TypeDoc API reference at /api, on one
# Pages site. The build reads the site's address from the Pages settings: https://pmndrs.github.io/bvh/
# today, https://bvh.docs.pmnd.rs once the custom domain is set (Settings > Pages) and pmnd.rs has
# a CNAME for bvh.docs; the domain is the fallback when the settings can't be read (a fork's PR).
# Pushes and pull requests only build it, to catch MDX errors.
# Deploying is manual (Actions > this workflow > Run workflow). tools/docs-site.ts is the build both here and locally (`pnpm docs:site`); it leaves
# out docs/internals (contributor notes, plain Markdown) and docs/snippets (the code samples,
# checked by `pnpm test`).

on:
  push:
    branches: ['main']
    paths:
      - 'docs/**'
      - 'src/**'
      - 'typedoc.json'
      - 'tools/docs-site.ts'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'typedoc.json'
      - 'tools/docs-site.ts'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# A pull request's ref is `refs/pull/<n>/merge`, so its runs never cancel a main deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # the site's address, below
    steps:
      # Full history and tags for the version label in the sidebar (`git describe --tags`), but
      # blobless: past file contents are not fetched.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every code block is its type-checked sample in docs/snippets (pnpm test runs it too).
      - run: pnpm docs:check
      - run: pnpm docs:api
      # The address Pages serves the site at, and its path: https://pmndrs.github.io/bvh/ gives
      # BASE_PATH /bvh; a custom domain gives an empty one.
      - id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/${{ github.repository }}/pages" --jq .html_url 2>/dev/null || true)
          url=${url:-https://bvh.docs.pmnd.rs/}
          url=${url%/}
          path=$(echo "$url" | sed -E 's#^https?://[^/]+##')
          echo "Site: $url (base path '${path}')"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - run: pnpm docs:site _site
        env:
          NEXT_PUBLIC_URL: ${{ steps.site.outputs.url }}
          BASE_PATH: ${{ steps.site.outputs.path }}
          MDX_BASEURL: https://github.com/${{ github.repository }}/raw/${{ github.event.pull_request.head.sha || github.sha }}/docs
          SOURCECODE_BASEURL: https://github.com/${{ github.repository }}/tree/${{ github.event.pull_request.head.sha || github.sha }}
          EDIT_BASEURL: https://github.com/${{ github.repository }}/edit/${{ github.head_ref || 'main' }}/docs
          CONTRIBUTORS_PAT: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    # Grant GITHUB_TOKEN the permissions a Pages deployment needs.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
