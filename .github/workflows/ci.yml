name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      # The pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Builds dist/ and runs scripts/verify-artifacts.mjs (fails if a licence header is lost).
      - run: pnpm build
      - name: The built package imports in Node
        run: node -e "import('./dist/index.js').then(m => console.log(Object.keys(m).length + ' exports'))"

  wasm:
    name: tinybvh wasm reproduces (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # native/build-wasm.ts clones emsdk into tools/emsdk (gitignored), installs the pinned
      # Emscripten there, and refuses a folder at another commit. The key holds the pins.
      - uses: actions/cache@v4.2.3
        with:
          path: tools/emsdk
          key: emsdk-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/build-wasm.ts') }}
      - run: pnpm bvh:wasm --check --out "$RUNNER_TEMP/tinybvh-rebuilt.wasm"
      - name: Keep the rebuilt .wasm
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: tinybvh-rebuilt-${{ runner.os }}
          path: ${{ runner.temp }}/tinybvh-rebuilt.wasm
          if-no-files-found: ignore

  gpu-swiftshader:
    name: GPU pages (headless Chrome, SwiftShader)
    runs-on: ubuntu-latest
    # Verified 2026-11-11: all three pages pass on SwiftShader in about 5.5 minutes in total.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: pnpm/action-setup@v4.1.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: browser-actions/setup-chrome@v1.7.3
        id: chrome
        with:
          chrome-version: stable
      - name: Asset-free correctness pages
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          # BVH_ALLOW_SOFTWARE_ADAPTER=1 is the runner's explicit opt-in for a software adapter;
          # without it the runner rejects SwiftShader. tests/gpu/chrome.ts appends these to Chrome's flags. SwiftShader has no
          # `subgroups`, so bvh-lbvh-fallback exercises the tinybvh fallback.
          BVH_CHROME_FLAGS: --no-sandbox --use-webgpu-adapter=swiftshader --use-angle=swiftshader --enable-unsafe-swiftshader
          BVH_ALLOW_SOFTWARE_ADAPTER: '1'
          # The reduced trace-oracle profile: every variant and case, fewer rays (tests/gpu/pages/trace-oracle/main.ts).
          BVH_PAGE_QUERY: profile=ci
        run: pnpm test:gpu:page bvh-lbvh-fallback,trace-inline,trace-oracle
